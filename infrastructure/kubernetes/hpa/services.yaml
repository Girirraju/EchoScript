apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata: {name: ingest-service, namespace: echoscript}
spec:
  scaleTargetRef: {apiVersion: apps/v1, kind: Deployment, name: ingest-service-blue}
  minReplicas: 2
  maxReplicas: 6
  metrics: [{type: Resource, resource: {name: cpu, target: {type: Utilization, averageUtilization: 65}}}]
  behavior: {scaleDown: {stabilizationWindowSeconds: 300}}

