apiVersion: v1
kind: ServiceAccount
metadata: {name: ingest-service, namespace: echoscript}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata: {name: transcription-job-manager, namespace: echoscript}
rules:
  - apiGroups: ["batch"]
    resources: ["jobs"]
    verbs: ["create", "get", "list", "watch"]
  - apiGroups: [""]
    resources: ["pods", "pods/log"]
    verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata: {name: ingest-job-manager, namespace: echoscript}
subjects: [{kind: ServiceAccount, name: ingest-service, namespace: echoscript}]
roleRef: {apiGroup: rbac.authorization.k8s.io, kind: Role, name: transcription-job-manager}

