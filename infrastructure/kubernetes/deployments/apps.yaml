apiVersion: apps/v1
kind: Deployment
metadata: {name: gateway-ui-blue, namespace: echoscript, labels: {app: gateway-ui, color: blue}}
spec:
  replicas: 2
  selector: {matchLabels: {app: gateway-ui, color: blue}}
  template:
    metadata: {labels: {app: gateway-ui, color: blue}}
    spec:
      nodeSelector: {role: app}
      containers:
        - name: gateway-ui
          image: ACCOUNT.dkr.ecr.ap-south-1.amazonaws.com/echoscript/gateway-ui:VERSION
          ports: [{containerPort: 80}]
          readinessProbe: {httpGet: {path: /, port: 80}, initialDelaySeconds: 5, periodSeconds: 5}
          livenessProbe: {httpGet: {path: /, port: 80}, initialDelaySeconds: 20, periodSeconds: 15}
          resources: {requests: {cpu: 50m, memory: 64Mi}, limits: {cpu: 250m, memory: 256Mi}}
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: ingest-service-blue, namespace: echoscript, labels: {app: ingest-service, color: blue}}
spec:
  replicas: 2
  selector: {matchLabels: {app: ingest-service, color: blue}}
  template:
    metadata: {labels: {app: ingest-service, color: blue}}
    spec:
      serviceAccountName: ingest-service
      nodeSelector: {role: app}
      containers:
        - name: ingest-service
          image: ACCOUNT.dkr.ecr.ap-south-1.amazonaws.com/echoscript/ingest-service:VERSION
          ports: [{containerPort: 8000}]
          envFrom: [{configMapRef: {name: echoscript-config}}, {secretRef: {name: echoscript-runtime}}]
          readinessProbe: {httpGet: {path: /ready, port: 8000}, initialDelaySeconds: 5, periodSeconds: 5}
          livenessProbe: {httpGet: {path: /health, port: 8000}, initialDelaySeconds: 20, periodSeconds: 15}
          resources: {requests: {cpu: 100m, memory: 192Mi}, limits: {cpu: 750m, memory: 768Mi}}
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: video-service-blue, namespace: echoscript, labels: {app: video-service, color: blue}}
spec:
  replicas: 1
  selector: {matchLabels: {app: video-service, color: blue}}
  template:
    metadata: {labels: {app: video-service, color: blue}}
    spec:
      nodeSelector: {role: app}
      containers:
        - name: video-service
          image: ACCOUNT.dkr.ecr.ap-south-1.amazonaws.com/echoscript/video-service:VERSION
          ports: [{containerPort: 8001}]
          envFrom: [{secretRef: {name: echoscript-runtime}}]
          readinessProbe: {httpGet: {path: /health, port: 8001}, initialDelaySeconds: 5, periodSeconds: 5}
          livenessProbe: {httpGet: {path: /health, port: 8001}, initialDelaySeconds: 20, periodSeconds: 15}
          resources: {requests: {cpu: 100m, memory: 128Mi}, limits: {cpu: 500m, memory: 512Mi}}

