groups:
  - name: echoscript
    rules:
      - alert: EchoScriptApiUnavailable
        expr: up{job="echoscript-ingest"} == 0
        for: 2m
        labels: {severity: critical}
        annotations: {summary: EchoScript ingest API is unavailable}
      - alert: EchoScriptHighFailureRate
        expr: rate(echoscript_job_results_total{status="failed"}[15m]) / clamp_min(rate(echoscript_job_results_total[15m]), 0.001) > 0.2
        for: 10m
        labels: {severity: warning}
        annotations: {summary: Transcription failure ratio exceeded 20 percent}

