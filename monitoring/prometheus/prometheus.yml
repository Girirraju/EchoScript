global: {scrape_interval: 15s, evaluation_interval: 15s}
rule_files: ["/etc/prometheus/alerts/*.yml"]
scrape_configs:
  - job_name: echoscript-ingest
    kubernetes_sd_configs: [{role: pod}]
    relabel_configs:
      - {source_labels: [__meta_kubernetes_pod_label_app], regex: ingest-service, action: keep}
      - {source_labels: [__meta_kubernetes_namespace], regex: echoscript, action: keep}

